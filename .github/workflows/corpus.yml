name: Corpus

# Manual only. Cloning the pinned public repos is not part of every PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    name: Score pinned corpus
    runs-on: ubuntu-latest
    environment: jev  # only jobs in this environment can read TYPESAFE_API_KEY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,extract]'

      - name: Score tuning and held-out extraction
        run: python scripts/corpus_score.py --split all

      # Report only: Jev judges every extracted edge, including edges that
      # appear only at each repo's current HEAD. Skipped without the secret.
      - name: Jev edge audit
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::notice::TYPESAFE_API_KEY is not set; the Jev edge audit was not run."
            exit 0
          fi
          python scripts/jev/edge_audit.py --log edge_audit_log.jsonl
