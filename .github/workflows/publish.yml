name: Publish to PyPI

# Runs on a tag push of the form `v*`: git tag v0.7.5 && git push origin v0.7.5
# Uses PyPI Trusted Publishing (OIDC), so no PyPI token is stored in GitHub.
#
# A release is published only when all of these hold:
#   1. the tagged commit is on main (a tag on an unreviewed branch is refused);
#   2. the tag matches pyproject.toml and semanticembed.__version__;
#   3. the full test suite passes on that commit;
#   4. someone approves the `pypi` environment. Set required reviewers in
#      Settings -> Environments -> pypi, and restrict it to `v*` tags.
#
# One-time PyPI setup: pypi.org -> Account -> Publishing -> trusted publisher
#   Project: semanticembed  Owner: jmurray10  Repository: semanticembed-sdk
#   Workflow: publish.yml   Environment: pypi
#
# Actions are pinned to commit SHAs; Dependabot proposes updates.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: Tag matches the package version
        run: |
          python - <<'EOF'
          import os, pathlib, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pkg = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = re.search(r"__version__\s*=\s*[\"']([^\"']+)",
                           pathlib.Path("src/semanticembed/__init__.py").read_text()).group(1)
          if not tag == pkg == init:
              sys.exit(f"::error::tag {tag}, pyproject.toml {pkg} and __version__ {init} must match")
          print(f"version {tag}")
          EOF

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,extract]'

      - name: Run pytest
        run: pytest -q

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; nothing else in this job can write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
