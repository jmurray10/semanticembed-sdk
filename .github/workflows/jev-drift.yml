name: Jev drift

# Weekly check that the Jev model behind the leak guard still answers the
# fixed cases in scripts/jev/canary_cases.json the way it did when the
# guard was measured (scripts/jev/canary_baseline.json). Also reports, without
# failing, how the moving alias jev-latest answers, so a new model release
# shows up before the pinned version is changed.
#
# Needs the secret TYPESAFE_API_KEY in the `jev` environment. About 48 requests a run.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare with baseline
    runs-on: ubuntu-latest
    environment: jev  # only jobs in this environment can read TYPESAFE_API_KEY
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install "httpx==0.28.1"

      - name: Run the drift check
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python -I scripts/jev/drift_canary.py --also jev-latest
